name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  pod-lib-lint:
    name: Pod Lib Lint
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install CocoaPods
        run: gem install cocoapods --no-document

      - name: Pod lib lint (iOS, macOS, watchOS)
        run: >
          pod lib lint IlkerSevimNetworking.podspec
          --allow-warnings
          --platforms=ios,osx,watchos
